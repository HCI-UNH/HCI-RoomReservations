<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Mock Room Reservations</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="error"></div>

  <div class="layout">
    <div class="sidebar">
      <h2>Rooms</h2>
      <div id="room-list"></div>
    </div>

    <div class="main">
      <div id="room-header"></div>

      <h2>Today's availability</h2>
      <div id="slots"></div>

      <hr>
      <h2>My Reservations</h2>
      <div id="my-reservations"></div>

      <hr>
      <!-- <h2>Announcements</h2> -->
      <div id="announcements">
        <!--
            Todo
              1. Replicate rough structure of nicegui announcements into
                   html + css + js
              2. Use similar templating idea from Alex
              3. wip
          -->
        <h2 id="announcements-header">Announcements (# unread)</h2>
        <div>
          <div id="announcements-unread"></div>
          <h3 id="announcements-no-new-messages" hidden>No new announcements...</h3>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
