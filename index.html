<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Mock Room Reservations</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="error"></div>

    <div class="layout">
      <div class="sidebar">
        <h2>Rooms</h2>
        <div id="room-list"></div>
      </div>

      <div class="main">
        <div id="room-header"></div>

        <div class="calendar">
          <div class="calendar-controls">
              <button id="prev-month">Previous</button>
              <h2 id="calendar-title"></h2>
              <button id="next-month">Next</button>
          </div>

          <div class="calendar-weekdays">
              <div>Sun</div>
              <div>Mon</div>
              <div>Tue</div>
              <div>Wed</div>
              <div>Thu</div>
              <div>Fri</div>
              <div>Sat</div>
          </div>

          <div id="calendar-body"></div>
        </div> 

        <h2>Today's availability</h2>
        <div id="slots"></div>

        <hr>
        <h2>My Reservations</h2>
        <div id="my-reservations"></div>

        <hr>
        <h2>Announcements</h2>
        <div id="announcements"></div>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
