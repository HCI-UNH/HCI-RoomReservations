<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Mock Room Reservations</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="error"></div>

  <div class="layout">
    <div class="sidebar">
      <h2>Rooms</h2>
      <div id="room-list"></div>
    </div>

    <div class="main">
      <div id="room-header"></div>

      <h2>Today's availability</h2>
      <div id="slots"></div>

      <hr>
      <h2>My Reservations</h2>
      <div id="my-reservations"></div>

      <hr>

      <div id="announcements">
        <h2 id="announcements-header">Announcements (# unread)</h2>
        <div>
          <div id="announcements-unread">
            <!-- populated by announcement messages -->
          </div>

          <h3 id="announcements-no-new-messages" hidden>No new announcements...</h3>

        </div>
        <button id="read-all-messages" type="button" onclick="clearAnnouncements()">
          Clear all messages
        </button>

        <!-- Announcement message template for populating unread announcements -->
        <template id="announcement-message-template">
          <div class="announcement-message">
            <!-- text and other information for announcement -->
            <details class="announcement-message-details">
              <summary class="announcement-message-summary">Message title</summary>
              <div class="announcement-message-details-content">Message details</div>
            </details>
            <!-- mark as read button -->
            <button class="announcement-message-read-button" type="button">
              <img class="announcement-message-read-button-image" alt="Mark announcement as read."
                src="res/icons/mail_closed_light.png" />
              <!-- Mark announcement as read -->
            </button>
          </div>
        </template>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
